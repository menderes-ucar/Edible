workflows:
  ios-release:
    name: Edible iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      groups:
        - edible_ios

      vars:
        APP_STORE_APPLE_ID: "6811003746"
        IOS_VERSION: "1.0.3"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mndrs.edible

    scripts:
      - name: Disable Swift Package Manager
        script: |
          set -e
          flutter config --no-enable-swift-package-manager

      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get

      - name: Configure iOS Google Maps key
        script: |
          set -e

          mkdir -p "$CM_BUILD_DIR/ios/Flutter"

          cat > "$CM_BUILD_DIR/ios/Flutter/Secrets.xcconfig" <<EOF
          GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY
          EOF

      - name: Install CocoaPods dependencies
        script: |
          set -e

          cd "$CM_BUILD_DIR/ios"

          echo "Installing CocoaPods dependencies..."

          export COCOAPODS_DISABLE_STATS=true

          for i in 1 2 3 4 5; do
            echo "========================================"
            echo "CocoaPods attempt: $i/5"
            echo "========================================"

            if pod install --repo-update --verbose; then
              echo "CocoaPods installation completed successfully."
              exit 0
            fi

            echo "CocoaPods attempt $i failed."

            if [ "$i" -lt 5 ]; then
              echo "Waiting 15 seconds before retry..."
              sleep 15
            fi
          done

          echo "CocoaPods installation failed after 5 attempts."
          exit 1

      - name: Set up iOS code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Calculate iOS build number
        script: |
          set -e

          LATEST_BUILD=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo "0")

          if [ "$LATEST_BUILD" -lt 11 ]; then
            BUILD_NUMBER=11
          else
            BUILD_NUMBER=$((LATEST_BUILD + 1))
          fi

          echo "========================================"
          echo "Edible iOS Release"
          echo "Latest App Store build: $LATEST_BUILD"
          echo "New build number:       $BUILD_NUMBER"
          echo "Version:                $IOS_VERSION"
          echo "========================================"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"

      - name: Build iOS IPA
        script: |
          set -e

          echo "========================================"
          echo "Building Edible iOS"
          echo "Version: $IOS_VERSION"
          echo "Build:   $BUILD_NUMBER"
          echo "========================================"

          flutter build ipa \
            --release \
            --build-name="$IOS_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcode_logs/*.log
      - build/ios/archive/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false