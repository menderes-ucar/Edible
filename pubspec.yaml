name: edible
description: "Edible - discover local culture, food and places."
publish_to: "none"
version: 1.0.0+4

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^17.0.0
  supabase_flutter: ^2.15.4
  google_maps_flutter: ^2.14.2
  geolocator: ^14.0.2
  path_provider: 2.1.5
  purchases_flutter: 9.16.0
  image_picker: 1.1.2
  share_plus: 10.1.4

  # Notifications
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: 5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/edible_icon3.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
